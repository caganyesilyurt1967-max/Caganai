<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağan AI | Sınırsız Yapay Zeka Portalı</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Prism.js for Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        dark: {
                            400: '#94a3b8',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 text-white font-inter h-screen overflow-hidden">
    <div id="app" class="flex h-screen relative">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar w-72 bg-dark-900 border-r border-dark-700 flex flex-col fixed h-full z-30 transition-all duration-300 -translate-x-full">
            <div class="p-4 border-b border-dark-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-primary-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-brain text-white text-sm"></i>
                    </div>
                    <span class="font-semibold text-white">Çağan AI</span>
                </div>
                <button id="closeSidebar" class="text-dark-400 hover:text-white transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-4">
                <button id="newChatBtn" class="w-full py-2.5 px-4 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span>Yeni Sohbet</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-2">
                <div class="px-2 py-2 text-xs font-medium text-dark-400 uppercase tracking-wider">Sohbet Geçmişi</div>
                <div id="chatHistoryList" class="space-y-1"></div>
            </div>
            
            <div class="p-4 border-t border-dark-700">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-primary-600 flex items-center justify-center text-white font-bold text-sm">ÇAI</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate">Kullanıcı</p>
                        <p class="text-xs text-dark-400 truncate">Sınırsız Erişim</p>
                    </div>
                </div>
            </div>
        </aside>
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden transition-opacity"></div>
        
        <!-- ANA İÇERİK -->
        <div class="flex-1 flex flex-col h-screen ml-0 transition-all duration-300">
            <header class="h-14 bg-dark-900/80 backdrop-blur-sm border-b border-dark-700 flex items-center px-4 gap-3 flex-shrink-0">
                <button id="openSidebar" class="text-dark-300 hover:text-white transition-colors text-xl">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="flex-1 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 bg-gradient-to-br from-primary-500 to-purple-600 rounded-md flex items-center justify-center">
                            <i class="fas fa-brain text-white text-xs"></i>
                        </div>
                        <span class="font-semibold text-sm text-white">Çağan AI</span>
                    </div>
                    <span class="text-xs text-green-400 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>
                        <span>Çevrimiçi</span>
                    </span>
                </div>
            </header>
            
            <!-- SOHBET ALANI -->
            <main id="chatArea" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
                <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-20 h-20 bg-gradient-to-br from-primary-500 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-primary-500/20">
                        <i class="fas fa-brain text-white text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-white mb-2">Çağan AI'a Hoş Geldiniz</h1>
                    <p class="text-dark-400 mb-8 max-w-md">Yapay zeka asistanınızla sohbet etmeye hemen başlayın.</p>
                </div>
                <div id="messagesContainer" class="hidden space-y-4"></div>
            </main>
            
            <!-- MESAJ GİRİŞ ALANI -->
            <div id="inputArea" class="border-t border-dark-700 bg-dark-900/80 backdrop-blur-sm px-4 py-3 flex-shrink-0">
                <div class="flex items-end gap-2 bg-dark-800 rounded-xl px-3 py-2 border border-dark-600 focus-within:border-primary-500 transition-all">
                    <textarea id="messageInput" rows="1" class="w-full bg-transparent text-white placeholder-dark-400 outline-none resize-none text-sm max-h-32 py-1.5" placeholder="Mesajınızı yazın..."></textarea>
                    <button id="sendBtn" class="w-9 h-9 flex items-center justify-center bg-primary-600 hover:bg-primary-700 text-white rounded-lg transition-all">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS BAĞLANTILARI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="/js/modules/auth.js"></script>
    <script src="/js/modules/chat.js"></script>
    <script src="/js/modules/sidebar.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
